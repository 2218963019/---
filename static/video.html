<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频答辩 - AI模拟答辩智能体</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f0f7ff;--card:#ffffff;--border:#dbeafe;--text:#1e3a5f;--dim:#64748b;--accent:#2563eb;--green:#16a34a;--red:#dc2626;--yellow:#d97706;--purple:#7c3aed}
body{font-family:-apple-system,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--border);box-shadow:0 2px 4px rgba(37,99,235,.06)}
.topbar h1{font-size:1.1rem}
.nav a{color:var(--dim);text-decoration:none;font-size:0.85rem;margin-left:12px}
.nav a:hover{color:var(--accent)}
.main{display:flex;flex:1;overflow:hidden}
.left-panel{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f8fafc;position:relative;border-right:1px solid var(--border)}
.right-panel{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f8fafc;position:relative}
.label{position:absolute;top:10px;left:10px;background:rgba(37,99,235,.1);padding:4px 12px;border-radius:6px;font-size:0.8rem;color:var(--accent);font-weight:600}
.label-r{color:var(--green)}
/* CSS数字人头像 */
.avatar{width:200px;height:200px;border-radius:50%;background:linear-gradient(135deg,#dbeafe,#e0e7ff);display:flex;align-items:center;justify-content:center;position:relative;border:3px solid var(--accent);box-shadow:0 0 30px rgba(37,99,235,.2)}
.avatar svg{width:160px;height:160px}
.face{position:relative}
.eye{width:20px;height:20px;background:#fff;border-radius:50%;position:absolute;top:50px}
.eye-l{left:35px}.eye-r{right:35px}
.pupil{width:10px;height:10px;background:#1e3a5f;border-radius:50%;position:absolute;top:5px;left:5px}
.mouth{width:60px;height:8px;background:#fff;border-radius:0 0 30px 30px;position:absolute;bottom:35px;left:50px;transition:height .15s}
.mouth.speaking{height:20px;border-radius:20px}
.avatar.speaking{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 30px rgba(37,99,235,.2)}50%{box-shadow:0 0 50px rgba(37,99,235,.4)}}
.blink{animation:blink 3s infinite}
@keyframes blink{0%,90%,100%{height:20px}95%{height:2px}}
/* 学生摄像头 */
.webcam{width:200px;height:150px;background:#e0ecff;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:0.85rem;border:2px solid var(--border)}
.webcam video{width:100%;height:100%;border-radius:6px;object-fit:cover}
/* 控制栏 */
.controls{display:flex;align-items:center;justify-content:center;gap:12px;padding:16px;background:var(--card);border-top:1px solid var(--border);box-shadow:0 -2px 4px rgba(37,99,235,.06)}
.mic-btn{width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;font-size:1.5rem;display:flex;align-items:center;justify-content:center;transition:all .2s}
.mic-btn.idle{background:#e0ecff;color:var(--accent)}
.mic-btn.rec{background:var(--red);color:#fff;animation:micPulse 1s infinite}
@keyframes micPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.ctrl-btn{padding:10px 20px;border-radius:8px;border:none;cursor:pointer;font-weight:600;font-size:0.85rem}
.ctrl-btn-primary{background:var(--accent);color:#fff}
.ctrl-btn-danger{background:var(--red);color:#fff}
.ctrl-btn-secondary{background:#e0ecff;color:var(--accent)}
/* 对话区 */
.chat-overlay{position:absolute;bottom:0;left:0;right:0;max-height:200px;overflow-y:auto;padding:10px;background:rgba(255,255,255,.85)}
.msg{padding:8px 14px;border-radius:10px;margin:4px 0;font-size:0.85rem;max-width:90%;line-height:1.5}
.msg-judge{background:#eff6ff;color:var(--text);border-left:3px solid var(--accent)}
.msg-student{background:#f0fdf4;color:var(--text);margin-left:auto;border-right:3px solid var(--green)}
.msg-sys{text-align:center;color:var(--dim);font-size:0.75rem}
/* 配置遮罩 */
.setup-overlay{position:fixed;inset:0;background:rgba(37,99,235,.2);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px)}
.setup-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:30px;max-width:500px;width:90%;box-shadow:0 8px 32px rgba(37,99,235,.15)}
.setup-card h2{color:var(--accent);margin-bottom:16px}
.setup-card label{display:block;color:var(--dim);font-size:0.85rem;margin:10px 0 4px}
.setup-card select,.setup-card textarea{width:100%;padding:8px 12px;background:#f8fafc;border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:0.9rem}
.setup-card textarea{min-height:100px;resize:vertical}
.setup-card .btn-row{display:flex;gap:8px;margin-top:16px}
.recording-indicator{position:absolute;top:10px;right:10px;background:var(--red);padding:4px 12px;border-radius:6px;font-size:0.75rem;color:#fff;display:none}
.recording-indicator.show{display:block;animation:blink 1s infinite}
.hidden{display:none!important}
.loading{color:var(--dim);text-align:center;padding:10px}
/* 评分结果遮罩 */
.result-overlay{position:fixed;inset:0;background:rgba(37,99,235,.25);display:none;align-items:center;justify-content:center;z-index:200;overflow-y:auto;padding:20px;backdrop-filter:blur(4px)}
.result-overlay.show{display:flex}
.result-card{background:var(--card);border:1px solid var(--border);border-radius:16px;max-width:700px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 8px 40px rgba(37,99,235,.2)}
.result-header{padding:24px 30px;border-bottom:1px solid var(--border);text-align:center}
.result-header h2{font-size:1.4rem;color:var(--accent);margin-bottom:16px}
.total-score-wrap{display:inline-block;padding:16px 40px;border-radius:12px;background:#f8fafc;border:2px solid var(--accent)}
.total-score-num{font-size:3.5rem;font-weight:800;line-height:1}
.total-score-label{font-size:0.9rem;color:var(--dim);margin-top:4px}
.total-score-num.good{color:var(--green)}.total-score-num.mid{color:var(--yellow)}.total-score-num.bad{color:var(--red)}
.result-body{padding:20px 30px}
.result-section{margin-bottom:20px}
.result-section h3{font-size:1rem;margin-bottom:10px}
.result-section ul{list-style:none;padding:0}
.result-section ul li{padding:6px 0 6px 20px;position:relative;font-size:0.9rem;line-height:1.6;color:var(--text)}
.result-section ul li::before{content:"•";position:absolute;left:0;color:var(--dim)}
.score-bar-item{margin-bottom:12px}
.score-bar-label{display:flex;justify-content:space-between;font-size:0.85rem;margin-bottom:4px}
.score-bar-track{height:10px;background:#e0ecff;border-radius:5px;overflow:hidden}
.score-bar-fill{height:100%;border-radius:5px;transition:width .8s ease}
.qa-item{background:#f8fafc;border-radius:8px;padding:12px;margin-bottom:8px;border-left:3px solid var(--purple)}
.qa-item .qa-q{font-size:0.9rem;font-weight:600;margin-bottom:4px}
.qa-item .qa-a{font-size:0.82rem;color:var(--dim);line-height:1.5}
.result-footer{padding:20px 30px;border-top:1px solid var(--border);text-align:center}
/* 暗色模式 */
[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#e2e8f0;--dim:#94a3b8;--accent:#38bdf8;--green:#4ade80;--red:#f87171;--yellow:#fbbf24;--purple:#a78bfa}
[data-theme="dark"] .left-panel,[data-theme="dark"] .right-panel{background:#000}
[data-theme="dark"] .chat-overlay{background:rgba(15,23,42,.85)}
[data-theme="dark"] .setup-overlay{background:rgba(0,0,0,.7)}
[data-theme="dark"] .setup-card{box-shadow:0 8px 32px rgba(0,0,0,.4)}
[data-theme="dark"] .setup-card select,[data-theme="dark"] .setup-card textarea{background:var(--bg)}
[data-theme="dark"] .result-overlay{background:rgba(0,0,0,.8)}
[data-theme="dark"] .result-card{box-shadow:0 8px 40px rgba(0,0,0,.5)}
[data-theme="dark"] .total-score-wrap{background:var(--bg)}
[data-theme="dark"] .score-bar-track{background:var(--bg)}
[data-theme="dark"] .qa-item{background:var(--bg)}
[data-theme="dark"] .mic-btn.idle{background:var(--border);color:var(--accent)}
[data-theme="dark"] .ctrl-btn-secondary{background:var(--border);color:var(--text)}
[data-theme="dark"] .ctrl-btn-primary{color:#0f172a}
[data-theme="dark"] .ctrl-btn-primary:hover{background:#7dd3fc}
[data-theme="dark"] .webcam{background:var(--border)}
[data-theme="dark"] .avatar{background:linear-gradient(135deg,#1e3a5f,#3b1f5e);box-shadow:0 0 30px rgba(56,189,248,.2)}
[data-theme="dark"] .avatar circle{fill:#1e293b;stroke:#38bdf8}
[data-theme="dark"] .msg-judge{background:#1e3a5f;border-left-color:var(--accent)}
[data-theme="dark"] .msg-student{background:#1a3d2e;border-right-color:var(--green)}
[data-theme="dark"] .label{background:rgba(56,189,248,.15)}
[data-theme="dark"] .topbar{box-shadow:none}
[data-theme="dark"] .controls{box-shadow:none}
[data-theme="dark"] .theme-btn #themeLabel{color:#fff}
.theme-btn{background:none;border:1px solid var(--border);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:1rem;display:flex;align-items:center;gap:4px;transition:all .2s;white-space:nowrap}
.theme-btn:hover{border-color:var(--accent);background:rgba(37,99,235,.08)}
.theme-btn #themeLabel{font-size:0.75rem}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <h1>🎬 视频答辩</h1>
    <div class="nav" style="display:flex;align-items:center;gap:12px"><a href="/app">文字答辩</a><a href="/teacher">教师端</a><button class="theme-btn" onclick="toggleTheme()" id="themeBtn"><span id="themeIcon">🌙</span> <span id="themeLabel">夜间模式</span></button></div>
  </div>

  <div class="main">
    <!-- 左：AI评委 -->
    <div class="left-panel">
      <span class="label">AI评委</span>
      <div class="avatar" id="avatar">
        <svg viewBox="0 0 160 160" class="face">
          <circle cx="80" cy="80" r="75" fill="#e0ecff" stroke="#2563eb" stroke-width="2"/>
          <ellipse class="eye blink" cx="55" cy="65" rx="12" ry="14" fill="#fff"/><circle cx="55" cy="68" r="6" fill="#1e3a5f"/>
          <ellipse class="eye blink" cx="105" cy="65" rx="12" ry="14" fill="#fff"/><circle cx="105" cy="68" r="6" fill="#1e3a5f"/>
          <ellipse class="mouth" id="mouth" cx="80" cy="110" rx="25" ry="4" fill="#fff"/>
          <path d="M 50 45 Q 80 25 110 45" stroke="#2563eb" stroke-width="2" fill="none"/>
        </svg>
      </div>
      <div id="avatarStatus" style="margin-top:12px;color:var(--dim);font-size:0.8rem">等待答辩开始</div>
      <div class="chat-overlay" id="chatBox"></div>
    </div>

    <!-- 右：学生 -->
    <div class="right-panel">
      <span class="label label-r">我（学生）</span>
      <div class="webcam" id="webcamBox">点击下方开启摄像头</div>
      <div class="recording-indicator" id="recIndicator">● 录音中</div>
      <div id="voiceText" style="margin-top:12px;color:var(--green);font-size:0.85rem;max-width:300px;text-align:center;min-height:20px"></div>
    </div>
  </div>

  <!-- 控制栏 -->
  <div class="controls">
    <span id="timerDisplay" style="color:var(--green);font-weight:600;font-size:1rem;min-width:70px;display:none">⏱ 03:00</span>
    <button class="ctrl-btn ctrl-btn-secondary" onclick="toggleCamera()" id="camBtn">📷 摄像头</button>
    <button class="mic-btn idle" onclick="toggleMic()" id="micBtn">🎤</button>
    <button class="ctrl-btn ctrl-btn-primary" onclick="submitAnswer()" id="submitBtn">提交回答</button>
    <button class="ctrl-btn ctrl-btn-danger" onclick="endDefense()" id="endBtn">结束答辩</button>
  </div>
</div>

<!-- 评分结果遮罩 -->
<div class="result-overlay" id="resultOverlay">
  <div class="result-card">
    <div class="result-header">
      <h2>答辩评审结果</h2>
      <div class="total-score-wrap" id="totalScoreWrap">
        <div class="total-score-num" id="totalScoreNum">--</div>
        <div class="total-score-label">总分 / 100</div>
      </div>
    </div>
    <div class="result-body" id="resultBody">
      <div class="result-section">
        <h3>📊 各维度评分</h3>
        <div id="scoreBars"></div>
      </div>
      <div class="result-section" id="strengthSection">
        <h3 style="color:var(--green)">✅ 优势</h3>
        <ul id="strengthList"></ul>
      </div>
      <div class="result-section" id="weaknessSection">
        <h3 style="color:var(--red)">⚠️ 不足</h3>
        <ul id="weaknessList"></ul>
      </div>
      <div class="result-section" id="suggestSection">
        <h3 style="color:var(--yellow)">💡 改进建议</h3>
        <ul id="suggestList"></ul>
      </div>
      <div class="result-section" id="qaSection">
        <h3 style="color:var(--purple)">📝 Q&A 问题集</h3>
        <div id="qaList"></div>
      </div>
    </div>
    <div class="result-footer">
      <button class="ctrl-btn ctrl-btn-secondary" onclick="polishAnswers()" style="font-size:1rem;padding:12px 24px">✨ 话术润色</button>
      <button class="ctrl-btn ctrl-btn-secondary" onclick="exportPDF()" style="font-size:1rem;padding:12px 24px">📄 导出PDF</button>
      <button class="ctrl-btn ctrl-btn-primary" onclick="location.reload()" style="font-size:1rem;padding:12px 32px">开始新答辩</button>
    </div>
    <div id="polishArea" style="padding:0 30px 20px;display:none">
      <h3 style="color:var(--accent);margin-bottom:12px">✨ 答辩话术润色</h3>
      <div id="polishContent"></div>
    </div>
  </div>
</div>

<!-- 配置遮罩 -->
<div class="setup-overlay" id="setupOverlay">
  <div class="setup-card">
    <h2>🎬 视频答辩设置</h2>
    <label>评委风格</label>
    <select id="persona">
      <option value="strict_tech">严厉技术型</option>
      <option value="practical">务实应用型</option>
      <option value="strategic">战略宏观型</option>
      <option value="encouraging">鼓励引导型</option>
      <option value="mixed">混合随机型</option>
    </select>
    <label>提问轮数</label>
    <select id="maxTurns"><option value="3">3轮</option><option value="5" selected>5轮</option><option value="8">8轮</option></select>
    <label>每轮限时</label>
    <select id="timeLimit"><option value="120">2分钟</option><option value="180" selected>3分钟</option><option value="300">5分钟</option></select>
    <label><input type="checkbox" id="recordToggle" checked> 全程录制存档（摄像头+语音）</label>
    <label>项目材料（粘贴或拖拽上传）</label>
    <div id="dropZone" style="border:2px dashed var(--border);border-radius:8px;padding:16px;text-align:center;color:var(--dim);cursor:pointer;margin-bottom:8px;transition:border-color .2s" onclick="document.getElementById('fileInput').click()">
      📁 点击或拖拽上传 docx/pdf
      <div id="fileInfo" style="color:var(--accent);margin-top:4px;font-size:0.85rem"></div>
      <input type="file" id="fileInput" accept=".docx,.pdf" style="display:none" onchange="handleFile(this.files[0])">
    </div>
    <textarea id="projectText" placeholder="或直接粘贴项目材料全文..."></textarea>
    <div class="btn-row">
      <button class="ctrl-btn ctrl-btn-primary" onclick="startVideoDefense()" id="startBtn">开始视频答辩</button>
    </div>
    <div id="avatarInfo" style="margin-top:12px;font-size:0.8rem;color:var(--dim)"></div>
  </div>
</div>

<script>
// ========== 主题切换 ==========
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  document.getElementById('themeIcon').textContent=next==='dark'?'☀️':'🌙';
  document.getElementById('themeLabel').textContent=next==='dark'?'日间模式':'夜间模式';
  localStorage.setItem('theme',next);
}
(function(){const t=localStorage.getItem('theme')||'light';if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');setTimeout(()=>{const i=document.getElementById('themeIcon');const l=document.getElementById('themeLabel');if(i)i.textContent='☀️';if(l)l.textContent='日间模式';},0);}})();

let sessionId='',turnCount=0,maxT=5;
let isRecording=false;
let timeLimit=180,timerInterval=null,timerSeconds=0;
let recordToggle=false,videoRecorder=null,videoChunks=[],recordedBlob=null;
let cameraStream=null;
let avatarAvailable=false;
let finalAnswer='';
let audioChunks=[],micStream=null;
let audioContext=null,audioProcessor=null,audioSource=null;

// 拖拽上传
const dz=document.getElementById('dropZone');
dz.addEventListener('dragover',e=>{e.preventDefault();dz.style.borderColor='var(--accent)';});
dz.addEventListener('dragleave',()=>{dz.style.borderColor='var(--border)';});
dz.addEventListener('drop',e=>{e.preventDefault();dz.style.borderColor='var(--border)';if(e.dataTransfer.files.length)handleFile(e.dataTransfer.files[0]);});

// 录音（直接录WAV PCM，不经过MediaRecorder的webm格式）+ 后端语音识别
async function startRecording(){
  try{
    micStream=await navigator.mediaDevices.getUserMedia({audio:{sampleRate:16000,channelCount:1,echoCancellation:true,noiseSuppression:true}});
  }catch(e){
    document.getElementById('voiceText').textContent='❌ 麦克风权限被拒绝: '+e.message;
    return false;
  }
  audioChunks=[];
  audioContext=new(window.AudioContext||window.webkitAudioContext)({sampleRate:16000});
  audioSource=audioContext.createMediaStreamSource(micStream);
  audioProcessor=audioContext.createScriptProcessor(4096,1,1);
  audioProcessor.onaudioprocess=e=>{const data=e.inputBuffer.getChannelData(0);audioChunks.push(new Float32Array(data));};
  audioSource.connect(audioProcessor);
  audioProcessor.connect(audioContext.destination);
  return true;
}
function stopRecording(){
  if(audioProcessor)audioProcessor.disconnect();
  if(audioSource)audioSource.disconnect();
  if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null;}
  if(audioChunks.length>0){
    const wav=encodeWAV(audioChunks,16000);
    sendToSTT(wav);
  }
  audioChunks=[];
  if(audioContext){audioContext.close();audioContext=null;}
}
function encodeWAV(chunks,sampleRate){
  let total=0;for(let c of chunks)total+=c.length;
  const samples=new Float32Array(total);
  let off=0;for(let c of chunks){samples.set(c,off);off+=c.length;}
  const buf=new ArrayBuffer(44+samples.length*2);
  const v=new DataView(buf);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  ws(0,'RIFF');v.setUint32(4,36+samples.length*2,true);ws(8,'WAVE');ws(12,'fmt ');
  v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sampleRate,true);v.setUint32(28,sampleRate*2,true);
  v.setUint16(32,2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,samples.length*2,true);
  let p=44;for(let i=0;i<samples.length;i++){const s=Math.max(-1,Math.min(1,samples[i]));v.setInt16(p,s<0?s*0x8000:s*0x7FFF,true);p+=2;}
  return new Blob([buf],{type:'audio/wav'});
}
async function sendToSTT(blob){
  document.getElementById('voiceText').textContent='🔍 语音识别中...';
  const fd=new FormData();fd.append('file',blob,'audio.wav');
  try{
    const r=await fetch('/stt',{method:'POST',body:fd});
    if(!r.ok){const d=await r.json();document.getElementById('voiceText').textContent='❌ 识别失败: '+(d.detail||'未知错误');return;}
    const d=await r.json();
    finalAnswer=d.text||'';
    if(finalAnswer){document.getElementById('voiceText').textContent=finalAnswer;}
    else{document.getElementById('voiceText').innerHTML='<span style="color:var(--red)">⚠️ 未识别到语音内容，请点🎤重新录音，说话时靠近麦克风、放慢语速、声音洪亮</span>';}
  }catch(e){document.getElementById('voiceText').textContent='❌ 网络错误: '+e.message;}
}

// TTS
function speak(text){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/[*#`_]/g,'').slice(0,500));u.lang='zh-CN';u.rate=1.0;u.onstart=()=>{document.getElementById('avatar').classList.add('speaking');document.getElementById('mouth').setAttribute('ry','12');};u.onend=()=>{document.getElementById('avatar').classList.remove('speaking');document.getElementById('mouth').setAttribute('ry','4');};window.speechSynthesis.speak(u);}

function addMsg(t,txt){const b=document.getElementById('chatBox');const d=document.createElement('div');d.className='msg msg-'+t;d.textContent=txt;b.appendChild(d);b.scrollTop=b.scrollHeight;}

async function api(p,d){const r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});if(!r.ok)throw new Error((await r.json()).detail||'失败');return r.json();}

async function handleFile(f){if(!f)return;const ext=f.name.split('.').pop().toLowerCase();if(!['docx','pdf'].includes(ext)){document.getElementById('fileInfo').innerHTML='<span style="color:var(--red)">仅支持docx/pdf</span>';return;}document.getElementById('fileInfo').textContent='上传中: '+f.name+'...';const fd=new FormData();fd.append('file',f);try{const r=await fetch('/upload',{method:'POST',body:fd});if(!r.ok)throw new Error((await r.json()).detail||'上传失败');const d=await r.json();document.getElementById('projectText').value=d.text;document.getElementById('fileInfo').innerHTML='✓ '+d.filename+' ('+d.char_count+'字)';}catch(e){document.getElementById('fileInfo').innerHTML='<span style="color:var(--red)">✗ '+e.message+'</span>';}}

async function startVideoDefense(){
  const pt=document.getElementById('projectText').value.trim();
  if(!pt){alert('请输入项目材料');return;}
  const persona=document.getElementById('persona').value;
  const mt=parseInt(document.getElementById('maxTurns').value);
  timeLimit=parseInt(document.getElementById('timeLimit').value);
  recordToggle=document.getElementById('recordToggle').checked;
  document.getElementById('startBtn').disabled=true;document.getElementById('startBtn').textContent='启动中...';
  try{
    const r=await api('/start',{persona,scenario:'大创立项',project_text:pt,max_turns:mt});
    sessionId=r.session_id;turnCount=1;maxT=mt;
    document.getElementById('setupOverlay').classList.add('hidden');
    document.getElementById('avatarStatus').textContent='评委正在提问...';
    addMsg('sys','答辩开始 — '+r.persona+' · 共'+mt+'轮');
    addMsg('judge',r.question);
    speak(r.question);
    startTimer();
    if(recordToggle)startVideoRecord();
  }catch(e){alert('启动失败: '+e.message);}
  document.getElementById('startBtn').disabled=false;document.getElementById('startBtn').textContent='开始视频答辩';
}

async function toggleMic(){if(isRecording){stopMic();}else{await startMic();}}
async function startMic(){isRecording=true;finalAnswer='';document.getElementById('micBtn').className='mic-btn rec';document.getElementById('micBtn').textContent='⏹';document.getElementById('recIndicator').classList.add('show');document.getElementById('voiceText').textContent='🎙️ 录音中... (再点一次停止)';const ok=await startRecording();if(!ok){isRecording=false;document.getElementById('micBtn').className='mic-btn idle';document.getElementById('micBtn').textContent='🎤';document.getElementById('recIndicator').classList.remove('show');}}
function stopMic(){isRecording=false;document.getElementById('micBtn').className='mic-btn idle';document.getElementById('micBtn').textContent='🎤';document.getElementById('recIndicator').classList.remove('show');stopRecording();}

async function toggleCamera(){if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null;document.getElementById('webcamBox').innerHTML='点击下方开启摄像头';document.getElementById('camBtn').textContent='📷 摄像头';return;}try{cameraStream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});const v=document.createElement('video');v.srcObject=cameraStream;v.autoplay=true;v.muted=true;document.getElementById('webcamBox').innerHTML='';document.getElementById('webcamBox').appendChild(v);document.getElementById('camBtn').textContent='📷 关闭摄像头';}catch(e){alert('无法访问摄像头: '+e.message);}}

async function submitAnswer(){if(isRecording){alert('请先点⏹停止录音，等识别出文字后再提交');return;}const ans=finalAnswer.trim();if(!ans){alert('请先录音或输入回答');return;}document.getElementById('submitBtn').disabled=true;stopTimer();addMsg('student',ans);finalAnswer='';document.getElementById('voiceText').textContent='';try{const r=await api('/answer',{session_id:sessionId,answer:ans});if(r.type==='followup'){addMsg('judge',r.question);speak(r.question);startTimer();}else if(r.type==='new_question'){turnCount++;addMsg('sys','—— 第'+turnCount+'轮 ——');addMsg('judge',r.question);speak(r.question);startTimer();}else if(r.type==='finished'){addMsg('sys','答辩结束');await doEvaluate();}}catch(e){alert('提交失败: '+e.message);}document.getElementById('submitBtn').disabled=false;}

async function doEvaluate(){
  document.getElementById('avatarStatus').textContent='评委评审中...';
  addMsg('sys','正在生成评审报告...');
  stopTimer();
  stopVideoRecord();
  try{
    const r=await api('/evaluate',{session_id:sessionId});
    const ev=r.evaluation;
    let qaList=[];
    try{const rr=await api('/report',{session_id:sessionId});if(rr.QA问题集)qaList=rr.QA问题集;}catch(e){}

    // 总分
    const total=ev.总分;
    const numEl=document.getElementById('totalScoreNum');
    numEl.textContent=total.toFixed(1);
    numEl.className='total-score-num '+(total>=80?'good':total>=60?'mid':'bad');

    // 各维度评分进度条
    const bars=document.getElementById('scoreBars');
    bars.innerHTML='';
    (ev.各维度评分||[]).forEach(s=>{
      const pct=Math.min(100,Math.max(0,s.分数));
      const color=pct>=80?'var(--green)':pct>=60?'var(--yellow)':'var(--red)';
      bars.innerHTML+=`<div class="score-bar-item"><div class="score-bar-label"><span>${s.维度}</span><span style="color:${color};font-weight:600">${s.分数.toFixed(1)}</span></div><div class="score-bar-track"><div class="score-bar-fill" style="width:${pct}%;background:${color}"></div></div></div>`;
    });

    // 优势/不足/建议
    const fillList=(id,items)=>{const el=document.getElementById(id);if(!items||!items.length){el.parentElement.style.display='none';return;}el.innerHTML=items.map(x=>`<li>${x}</li>`).join('');};
    fillList('strengthList',ev.优势);
    fillList('weaknessList',ev.不足);
    fillList('suggestList',ev.改进建议);

    // Q&A问题集
    const qaEl=document.getElementById('qaList');
    if(qaList.length){
      qaEl.innerHTML=qaList.slice(0,8).map((q,i)=>`<div class="qa-item"><div class="qa-q">Q${i+1}: ${q.问题||q.question||''}</div><div class="qa-a">${q.参考答案||q.reference_answer||''}</div></div>`).join('');
    }else{
      document.getElementById('qaSection').style.display='none';
    }

    document.getElementById('resultOverlay').classList.add('show');
    // 录制回放下载
    if(window._recordedUrl){
      const footer=document.querySelector('.result-footer');
      const dl=document.createElement('button');
      dl.className='ctrl-btn ctrl-btn-secondary';dl.style.cssText='font-size:1rem;padding:12px 24px';
      dl.textContent='📹 下载答辩录像';
      dl.onclick=()=>{const a=document.createElement('a');a.href=window._recordedUrl;a.download='答辩录像_'+new Date().toISOString().slice(0,19)+'.webm';a.click();};
      footer.insertBefore(dl,footer.firstChild);
    }
  }catch(e){alert('评审失败: '+e.message);}
}

async function endDefense(){if(!confirm('确定结束答辩？'))return;if(isRecording)stopMic();stopTimer();addMsg('sys','学生主动结束');await doEvaluate();}

// ========== 计时器 ==========
function startTimer(){stopTimer();timerSeconds=timeLimit;const d=document.getElementById('timerDisplay');d.style.display='inline';d.style.color='var(--green)';updTimer();timerInterval=setInterval(()=>{timerSeconds--;updTimer();if(timerSeconds<=0){stopTimer();alert('⏰ 时间到！请尽快提交回答。');}else if(timerSeconds===30)d.style.color='var(--yellow)';else if(timerSeconds===10)d.style.color='var(--red)';},1000);}
function stopTimer(){if(timerInterval){clearInterval(timerInterval);timerInterval=null;}document.getElementById('timerDisplay').style.display='none';}
function updTimer(){const m=Math.floor(timerSeconds/60).toString().padStart(2,'0');const s=(timerSeconds%60).toString().padStart(2,'0');document.getElementById('timerDisplay').textContent='⏱ '+m+':'+s;}

// ========== 全程录制存档 ==========
async function startVideoRecord(){
  videoChunks=[];
  try{
    let stream=cameraStream;
    if(!stream){
      try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});}catch(e){return;}
    }
    const tracks=[...stream.getTracks()];
    if(!stream.getAudioTracks().length){
      try{const as=await navigator.mediaDevices.getUserMedia({audio:true});tracks.push(...as.getAudioTracks());}catch(e){}
    }
    const comb=new MediaStream(tracks);
    const mr=new MediaRecorder(comb,{mimeType:'video/webm;codecs=vp8,opus'});
    mr.ondataavailable=e=>{if(e.data.size>0)videoChunks.push(e.data);};
    mr.onstop=()=>{
      recordedBlob=new Blob(videoChunks,{type:'video/webm'});
      window._recordedUrl=URL.createObjectURL(recordedBlob);
      addMsg('sys','📹 全程录制已保存，答辩结束后可下载回放');
    };
    mr.start();
    videoRecorder=mr;
  }catch(e){console.warn('录制启动失败:',e);}
}
function stopVideoRecord(){if(videoRecorder&&videoRecorder.state!=='inactive'){videoRecorder.stop();videoRecorder=null;}}

// ========== 答辩话术润色 ==========
async function polishAnswers(){
  const area=document.getElementById('polishArea');
  const content=document.getElementById('polishContent');
  area.style.display='block';
  content.innerHTML='<div style="color:var(--dim);text-align:center;padding:20px">正在润色...</div>';
  try{
    const res=await api('/polish',{session_id:sessionId});
    let html='';
    res.results.forEach(r=>{
      html+=`<div style="margin-bottom:16px;padding:12px;background:var(--bg);border-radius:8px">
        <div style="font-weight:600;color:var(--accent);margin-bottom:8px">第${r.round}轮</div>
        <div style="color:var(--dim);font-size:0.85rem;margin-bottom:8px">📌 ${r.question}</div>
        <div style="margin-bottom:8px"><span style="color:var(--red);font-size:0.8rem">原始：</span><br><span style="color:var(--dim)">${r.original}</span></div>
        <div><span style="color:var(--green);font-size:0.8rem">✨ 润色：</span><br><span style="color:var(--text)">${r.polished}</span></div></div>`;
    });
    content.innerHTML=html||'<p style="color:var(--dim)">暂无回答可润色</p>';
  }catch(e){content.innerHTML='<p style="color:var(--red)">润色失败: '+e.message+'</p>';}
}

// ========== 导出PDF ==========
async function exportPDF(){
  const w=window.open('', '_blank');
  if(!w){alert('请允许弹出窗口以导出PDF');return;}
  w.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>答辩报告</title><style>body{font-family:sans-serif;max-width:800px;margin:0 auto;padding:20px;color:#333}h1{color:#1e3a5f}h2{color:#38bdf8;border-bottom:2px solid #38bdf8;padding-bottom:4px}.qa{margin:12px 0;padding:10px;background:#f5f5f5;border-radius:8px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #ddd;padding:8px}</style></head><body><h1>AI模拟答辩报告</h1><p>生成时间: '+new Date().toLocaleString()+'</p>');
  try{
    const sess=await fetch('/session/'+sessionId).then(r=>r.json());
    w.document.write('<h2>答辩记录</h2>');
    sess.turns.forEach(t=>{w.document.write('<div class="qa"><strong>第'+t.轮次+'轮 评委：</strong>'+t.问题+'<br><strong>学生：</strong>'+t.回答+'</div>');t.追问.forEach((fq,i)=>{w.document.write('<div class="qa"><strong>追问：</strong>'+fq+'<br><strong>回答：</strong>'+(t.追问回答[i]||'')+'</div>');});});
    if(sess.evaluation){const ev=sess.evaluation;w.document.write('<h2>评审结果</h2><p style="font-size:1.5rem;font-weight:bold">总分: '+ev.总分.toFixed(1)+'/100</p><table><tr><th>维度</th><th>分数</th></tr>');ev.各维度评分.forEach(s=>w.document.write('<tr><td>'+s.维度+'</td><td>'+s.分数.toFixed(1)+'</td></tr>'));w.document.write('</table>');if(ev.优势)w.document.write('<p><strong>优势：</strong>'+ev.优势.join('；')+'</p>');if(ev.不足)w.document.write('<p><strong>不足：</strong>'+ev.不足.join('；')+'</p>');if(ev.改进建议)w.document.write('<p><strong>改进建议：</strong><br>'+ev.改进建议.map((s,i)=>i+1+'. '+s).join('<br>')+'</p>');}
  }catch(e){w.document.write('<p>加载失败: '+e.message+'</p>');}
  w.document.write('</body></html>');w.document.close();setTimeout(()=>w.print(),500);
}
