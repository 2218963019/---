<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频答辩 - AI模拟答辩智能体</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e1a;--card:#111827;--border:#1f2937;--text:#e2e8f0;--dim:#64748b;--accent:#38bdf8;--green:#4ade80;--red:#f87171;--yellow:#fbbf24;--purple:#a78bfa}
body{font-family:-apple-system,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--border)}
.topbar h1{font-size:1.1rem}
.nav a{color:var(--dim);text-decoration:none;font-size:0.85rem;margin-left:12px}
.nav a:hover{color:var(--accent)}
.main{display:flex;flex:1;overflow:hidden}
.left-panel{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;position:relative;border-right:1px solid var(--border)}
.right-panel{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;position:relative}
.label{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.6);padding:4px 12px;border-radius:6px;font-size:0.8rem;color:var(--accent)}
.label-r{color:var(--green)}
/* CSS数字人头像 */
.avatar{width:200px;height:200px;border-radius:50%;background:linear-gradient(135deg,#1e3a5f,#3b1f5e);display:flex;align-items:center;justify-content:center;position:relative;border:3px solid var(--accent);box-shadow:0 0 30px rgba(56,189,248,.3)}
.avatar svg{width:160px;height:160px}
.face{position:relative}
.eye{width:20px;height:20px;background:#fff;border-radius:50%;position:absolute;top:50px}
.eye-l{left:35px}.eye-r{right:35px}
.pupil{width:10px;height:10px;background:#000;border-radius:50%;position:absolute;top:5px;left:5px}
.mouth{width:60px;height:8px;background:#fff;border-radius:0 0 30px 30px;position:absolute;bottom:35px;left:50px;transition:height .15s}
.mouth.speaking{height:20px;border-radius:20px}
.avatar.speaking{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 30px rgba(56,189,248,.3)}50%{box-shadow:0 0 50px rgba(56,189,248,.6)}}
.blink{animation:blink 3s infinite}
@keyframes blink{0%,90%,100%{height:20px}95%{height:2px}}
/* 学生摄像头 */
.webcam{width:200px;height:150px;background:#1a1a2e;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:0.85rem;border:2px solid var(--border)}
.webcam video{width:100%;height:100%;border-radius:6px;object-fit:cover}
/* 控制栏 */
.controls{display:flex;align-items:center;justify-content:center;gap:12px;padding:16px;background:var(--card);border-top:1px solid var(--border)}
.mic-btn{width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;font-size:1.5rem;display:flex;align-items:center;justify-content:center;transition:all .2s}
.mic-btn.idle{background:var(--border);color:var(--text)}
.mic-btn.rec{background:var(--red);color:#fff;animation:micPulse 1s infinite}
@keyframes micPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.ctrl-btn{padding:10px 20px;border-radius:8px;border:none;cursor:pointer;font-weight:600;font-size:0.85rem}
.ctrl-btn-primary{background:var(--accent);color:#000}
.ctrl-btn-danger{background:var(--red);color:#fff}
.ctrl-btn-secondary{background:var(--border);color:var(--text)}
/* 对话区 */
.chat-overlay{position:absolute;bottom:0;left:0;right:0;max-height:200px;overflow-y:auto;padding:10px;background:rgba(0,0,0,.7)}
.msg{padding:8px 14px;border-radius:10px;margin:4px 0;font-size:0.85rem;max-width:90%;line-height:1.5}
.msg-judge{background:#1e3a5f;color:var(--text);border-left:3px solid var(--accent)}
.msg-student{background:#1a3d2e;color:var(--text);margin-left:auto;border-right:3px solid var(--green)}
.msg-sys{text-align:center;color:var(--dim);font-size:0.75rem}
/* 配置遮罩 */
.setup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:100}
.setup-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:30px;max-width:500px;width:90%}
.setup-card h2{color:var(--accent);margin-bottom:16px}
.setup-card label{display:block;color:var(--dim);font-size:0.85rem;margin:10px 0 4px}
.setup-card select,.setup-card textarea{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:0.9rem}
.setup-card textarea{min-height:100px;resize:vertical}
.setup-card .btn-row{display:flex;gap:8px;margin-top:16px}
.recording-indicator{position:absolute;top:10px;right:10px;background:var(--red);padding:4px 12px;border-radius:6px;font-size:0.75rem;color:#fff;display:none}
.recording-indicator.show{display:block;animation:blink 1s infinite}
.hidden{display:none!important}
.loading{color:var(--dim);text-align:center;padding:10px}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <h1>🎬 视频答辩</h1>
    <div class="nav"><a href="/app">文字答辩</a><a href="/teacher">教师端</a></div>
  </div>

  <div class="main">
    <!-- 左：AI评委 -->
    <div class="left-panel">
      <span class="label">AI评委</span>
      <div class="avatar" id="avatar">
        <svg viewBox="0 0 160 160" class="face">
          <circle cx="80" cy="80" r="75" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
          <ellipse class="eye blink" cx="55" cy="65" rx="12" ry="14" fill="#fff"/><circle cx="55" cy="68" r="6" fill="#000"/>
          <ellipse class="eye blink" cx="105" cy="65" rx="12" ry="14" fill="#fff"/><circle cx="105" cy="68" r="6" fill="#000"/>
          <ellipse class="mouth" id="mouth" cx="80" cy="110" rx="25" ry="4" fill="#fff"/>
          <path d="M 50 45 Q 80 25 110 45" stroke="#38bdf8" stroke-width="2" fill="none"/>
        </svg>
      </div>
      <div id="avatarStatus" style="margin-top:12px;color:var(--dim);font-size:0.8rem">等待答辩开始</div>
      <div class="chat-overlay" id="chatBox"></div>
    </div>

    <!-- 右：学生 -->
    <div class="right-panel">
      <span class="label label-r">我（学生）</span>
      <div class="webcam" id="webcamBox">点击下方开启摄像头</div>
      <div class="recording-indicator" id="recIndicator">● 录音中</div>
      <div id="voiceText" style="margin-top:12px;color:var(--green);font-size:0.85rem;max-width:300px;text-align:center;min-height:20px"></div>
    </div>
  </div>

  <!-- 控制栏 -->
  <div class="controls">
    <button class="ctrl-btn ctrl-btn-secondary" onclick="toggleCamera()" id="camBtn">📷 摄像头</button>
    <button class="mic-btn idle" onclick="toggleMic()" id="micBtn">🎤</button>
    <button class="ctrl-btn ctrl-btn-primary" onclick="submitAnswer()" id="submitBtn">提交回答</button>
    <button class="ctrl-btn ctrl-btn-danger" onclick="endDefense()" id="endBtn">结束答辩</button>
  </div>
</div>

<!-- 配置遮罩 -->
<div class="setup-overlay" id="setupOverlay">
  <div class="setup-card">
    <h2>🎬 视频答辩设置</h2>
    <label>评委风格</label>
    <select id="persona">
      <option value="strict_tech">严厉技术型</option>
      <option value="practical">务实应用型</option>
      <option value="strategic">战略宏观型</option>
      <option value="encouraging">鼓励引导型</option>
      <option value="mixed">混合随机型</option>
    </select>
    <label>提问轮数</label>
    <select id="maxTurns"><option value="3">3轮</option><option value="5" selected>5轮</option><option value="8">8轮</option></select>
    <label>项目材料（粘贴或拖拽上传）</label>
    <div id="dropZone" style="border:2px dashed var(--border);border-radius:8px;padding:16px;text-align:center;color:var(--dim);cursor:pointer;margin-bottom:8px;transition:border-color .2s" onclick="document.getElementById('fileInput').click()">
      📁 点击或拖拽上传 docx/pdf
      <div id="fileInfo" style="color:var(--accent);margin-top:4px;font-size:0.85rem"></div>
      <input type="file" id="fileInput" accept=".docx,.pdf" style="display:none" onchange="handleFile(this.files[0])">
    </div>
    <textarea id="projectText" placeholder="或直接粘贴项目材料全文..."></textarea>
    <div class="btn-row">
      <button class="ctrl-btn ctrl-btn-primary" onclick="startVideoDefense()" id="startBtn">开始视频答辩</button>
    </div>
    <div id="avatarInfo" style="margin-top:12px;font-size:0.8rem;color:var(--dim)"></div>
  </div>
</div>

<script>
let sessionId='',turnCount=0,maxT=5;
let isRecording=false;
let cameraStream=null;
let avatarAvailable=false;
let finalAnswer='';
let mediaRecorder=null,audioChunks=[],micStream=null;

// 拖拽上传
const dz=document.getElementById('dropZone');
dz.addEventListener('dragover',e=>{e.preventDefault();dz.style.borderColor='var(--accent)';});
dz.addEventListener('dragleave',()=>{dz.style.borderColor='var(--border)';});
dz.addEventListener('drop',e=>{e.preventDefault();dz.style.borderColor='var(--border)';if(e.dataTransfer.files.length)handleFile(e.dataTransfer.files[0]);});

// 录音 + 后端语音识别（不依赖Chrome Web Speech API）
async function startRecording(){
  try{
    micStream=await navigator.mediaDevices.getUserMedia({audio:true});
  }catch(e){
    document.getElementById('voiceText').textContent='❌ 麦克风权限被拒绝: '+e.message;
    return false;
  }
  audioChunks=[];
  const mime=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':'audio/webm';
  try{mediaRecorder=new MediaRecorder(micStream,{mimeType:mime});}
  catch(e){mediaRecorder=new MediaRecorder(micStream);}
  mediaRecorder.ondataavailable=e=>{if(e.data.size>0)audioChunks.push(e.data);};
  mediaRecorder.onstop=()=>{const blob=new Blob(audioChunks,{type:mime||'audio/webm'});sendToSTT(blob);};
  mediaRecorder.start();
  return true;
}
function stopRecording(){if(mediaRecorder&&mediaRecorder.state!=='inactive'){mediaRecorder.stop();}if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null;}}
async function sendToSTT(blob){
  document.getElementById('voiceText').textContent='🔍 语音识别中...';
  const fd=new FormData();fd.append('file',blob,'audio.webm');
  try{
    const r=await fetch('/stt',{method:'POST',body:fd});
    if(!r.ok){const d=await r.json();document.getElementById('voiceText').textContent='❌ 识别失败: '+(d.detail||'未知错误');return;}
    const d=await r.json();
    finalAnswer=d.text||'';
    document.getElementById('voiceText').textContent=finalAnswer||'（未识别到内容，请重试）';
  }catch(e){document.getElementById('voiceText').textContent='❌ 网络错误: '+e.message;}
}

// TTS
function speak(text){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/[*#`_]/g,'').slice(0,500));u.lang='zh-CN';u.rate=1.0;u.onstart=()=>{document.getElementById('avatar').classList.add('speaking');document.getElementById('mouth').setAttribute('ry','12');};u.onend=()=>{document.getElementById('avatar').classList.remove('speaking');document.getElementById('mouth').setAttribute('ry','4');};window.speechSynthesis.speak(u);}

function addMsg(t,txt){const b=document.getElementById('chatBox');const d=document.createElement('div');d.className='msg msg-'+t;d.textContent=txt;b.appendChild(d);b.scrollTop=b.scrollHeight;}

async function api(p,d){const r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});if(!r.ok)throw new Error((await r.json()).detail||'失败');return r.json();}

async function handleFile(f){if(!f)return;const ext=f.name.split('.').pop().toLowerCase();if(!['docx','pdf'].includes(ext)){document.getElementById('fileInfo').innerHTML='<span style="color:var(--red)">仅支持docx/pdf</span>';return;}document.getElementById('fileInfo').textContent='上传中: '+f.name+'...';const fd=new FormData();fd.append('file',f);try{const r=await fetch('/upload',{method:'POST',body:fd});if(!r.ok)throw new Error((await r.json()).detail||'上传失败');const d=await r.json();document.getElementById('projectText').value=d.text;document.getElementById('fileInfo').innerHTML='✓ '+d.filename+' ('+d.char_count+'字)';}catch(e){document.getElementById('fileInfo').innerHTML='<span style="color:var(--red)">✗ '+e.message+'</span>';}}

async function startVideoDefense(){
  const pt=document.getElementById('projectText').value.trim();
  if(!pt){alert('请输入项目材料');return;}
  const persona=document.getElementById('persona').value;
  const mt=parseInt(document.getElementById('maxTurns').value);
  document.getElementById('startBtn').disabled=true;document.getElementById('startBtn').textContent='启动中...';
  try{
    const r=await api('/start',{persona,scenario:'大创立项',project_text:pt,max_turns:mt});
    sessionId=r.session_id;turnCount=1;maxT=mt;
    document.getElementById('setupOverlay').classList.add('hidden');
    document.getElementById('avatarStatus').textContent='评委正在提问...';
    addMsg('sys','答辩开始 — '+r.persona+' · 共'+mt+'轮');
    addMsg('judge',r.question);
    speak(r.question);
  }catch(e){alert('启动失败: '+e.message);}
  document.getElementById('startBtn').disabled=false;document.getElementById('startBtn').textContent='开始视频答辩';
}

async function toggleMic(){if(isRecording){stopMic();}else{await startMic();}}
async function startMic(){isRecording=true;finalAnswer='';document.getElementById('micBtn').className='mic-btn rec';document.getElementById('micBtn').textContent='⏹';document.getElementById('recIndicator').classList.add('show');document.getElementById('voiceText').textContent='🎙️ 录音中... (再点一次停止)';const ok=await startRecording();if(!ok){isRecording=false;document.getElementById('micBtn').className='mic-btn idle';document.getElementById('micBtn').textContent='🎤';document.getElementById('recIndicator').classList.remove('show');}}
function stopMic(){isRecording=false;document.getElementById('micBtn').className='mic-btn idle';document.getElementById('micBtn').textContent='🎤';document.getElementById('recIndicator').classList.remove('show');stopRecording();}

async function toggleCamera(){if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null;document.getElementById('webcamBox').innerHTML='点击下方开启摄像头';document.getElementById('camBtn').textContent='📷 摄像头';return;}try{cameraStream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});const v=document.createElement('video');v.srcObject=cameraStream;v.autoplay=true;v.muted=true;document.getElementById('webcamBox').innerHTML='';document.getElementById('webcamBox').appendChild(v);document.getElementById('camBtn').textContent='📷 关闭摄像头';}catch(e){alert('无法访问摄像头: '+e.message);}}

async function submitAnswer(){if(isRecording){alert('请先点⏹停止录音，等识别出文字后再提交');return;}const ans=finalAnswer.trim();if(!ans){alert('请先录音或输入回答');return;}document.getElementById('submitBtn').disabled=true;addMsg('student',ans);finalAnswer='';document.getElementById('voiceText').textContent='';try{const r=await api('/answer',{session_id:sessionId,answer:ans});if(r.type==='followup'){addMsg('judge',r.question);speak(r.question);}else if(r.type==='new_question'){turnCount++;addMsg('sys','—— 第'+turnCount+'轮 ——');addMsg('judge',r.question);speak(r.question);}else if(r.type==='finished'){addMsg('sys','答辩结束');await doEvaluate();}}catch(e){alert('提交失败: '+e.message);}document.getElementById('submitBtn').disabled=false;}

async function doEvaluate(){document.getElementById('avatarStatus').textContent='评委评审中...';try{const r=await api('/evaluate',{session_id:sessionId});const ev=r.evaluation;addMsg('sys','总分: '+ev.总分.toFixed(1)+'/100');if(ev.不足)addMsg('sys','不足: '+ev.不足.join('；'));const rr=await api('/report',{session_id:sessionId});if(rr.QA问题集)addMsg('sys','已生成'+rr.QA问题集.length+'个Q&A问题');alert('答辩结束！总分:'+ev.总分.toFixed(1)+'/100\n\n刷新页面可开始新答辩');location.reload();}catch(e){alert('评审失败: '+e.message);}}

async function endDefense(){if(!confirm('确定结束答辩？'))return;if(isRecording)stopMic();addMsg('sys','学生主动结束');await doEvaluate();}

// 检查数字人
fetch('/avatar/check',{method:'POST'}).then(r=>r.json()).then(d=>{avatarAvailable=d.available;document.getElementById('avatarInfo').textContent=d.available?'✓ D-ID数字人已配置':'💡 当前使用免费动画数字人 | 接D-ID可获真人嘴型同步: studio.d-id.com';});
</script>
</body>
</html>
